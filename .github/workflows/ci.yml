name: ci

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - name: ruff check
        run: uvx ruff@0.17.1 check .
      - name: ruff format
        run: uvx ruff@0.17.1 format --check .

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - name: create environment
        run: uv venv --python ${{ matrix.python-version }} .venv
      - name: install cpu torch
        run: uv pip install --python .venv torch --index-url https://download.pytorch.org/whl/cpu
      - name: install package
        run: uv pip install --python .venv -e ".[dev,toy]"
      - name: pytest
        run: .venv/bin/python -m pytest --durations=10
