[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "dreamer-core"
version = "0.1.0"
description = "Tested PyTorch building blocks of DreamerV3-style world models: RSSM, KL balancing, symlog two-hot heads, lambda-returns"
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [{ name = "Gonzalo Fuentes" }]
keywords = ["world-models", "dreamer", "dreamerv3", "model-based-reinforcement-learning", "rssm", "pytorch"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "License :: OSI Approved :: MIT License",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = ["torch>=2.2", "numpy>=1.26"]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff==0.17.1"]
toy = ["pillow>=10"]

[project.urls]
Repository = "https://github.com/GonzaloFuentes1/dreamer-core"

[tool.hatch.build.targets.wheel]
packages = ["src/dreamer_core"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests", "scripts"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "NPY", "PT", "C4", "PIE", "RET"]
ignore = ["RUF002", "RUF003"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
